# v0.44.1 — Release workflow.
#
# Triggered when you push a tag matching `v*` (e.g. `v0.44.1`, `v1.0.0`).
# Builds NetMap.exe on a Windows runner and publishes it to a GitHub Release
# along with `latest.yml`, which electron-updater reads to notify installed
# clients of new versions.
#
# Usage:
#     git tag v0.44.1
#     git push origin v0.44.1
#
# The workflow will:
#   1. Check that package.json version matches the tag (safety net).
#   2. npm ci + strip cpu-features + npm run build:win
#   3. electron-builder publishes: NetMap-Setup-0.44.1.exe, NetMap-0.44.1.exe
#      (portable), latest.yml, *.blockmap files.
#   4. Auto-updater users get the update banner on next launch.
#
# Required secret:
#   - GITHUB_TOKEN — auto-provided by GitHub Actions with sufficient
#     permissions when `permissions: contents: write` is set below.

name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Version tag (e.g. v0.44.1). Must already exist as a git tag.'
        required: true

permissions:
  contents: write   # required for electron-builder to create the Release

jobs:
  build-and-publish:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Fetch the tag we're building, not the default branch.
          ref: ${{ github.ref }}

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Sanity check: package.json version must match the git tag (minus the "v")
      - name: Verify version matches tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF##*/v}"
          PKG_VERSION=$(node -p "require('./package.json').version")
          echo "Tag version:     $TAG_VERSION"
          echo "package.json:    $PKG_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Version mismatch — bump package.json to $TAG_VERSION before tagging."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
        shell: cmd

      - name: Strip cpu-features (avoids MSVC requirement)
        run: node scripts/strip-cpu-features.cjs
        shell: cmd

      - name: Rebuild native modules for Electron
        run: npx electron-builder install-app-deps
        shell: cmd

      - name: Build & publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run publish:win
        shell: cmd

      # Extra safety: upload the raw installer as a workflow artifact so it's
      # downloadable even if the Release step fails.
      - name: Upload installer as workflow artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: netmap-windows-installers
          path: |
            release/*.exe
            release/*.yml
            release/*.blockmap
          if-no-files-found: warn
          retention-days: 30
